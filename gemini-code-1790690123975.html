<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERK bildgenerator</title>
<style>
:root{--green:#0e5228;--red:#c8232c;--yellow:#f5c400;--white:#ffffff;--dark:#111111;--light-bg:#ffffff;--card-bg:#f0f4f1}*{box-sizing:border-box}
body{margin:0;background:#d8e2d9;color:#111;font:15px/1.4 Arial,Helvetica,sans-serif}
main{max-width:1150px;margin:20px auto;padding:14px;display:grid;grid-template-columns:360px 1fr;gap:18px}
.panel{background:#fff;border-radius:12px;padding:17px;box-shadow:0 2px 12px #0002;max-height:calc(100vh - 40px);overflow:auto}
h1{font-size:20px;margin:0 0 12px;color:var(--green)}h2{font-size:15px;margin:18px 0 6px;border-bottom:2px solid var(--red);padding-bottom:4px;color:var(--green)}
label{display:block;font-weight:700;font-size:12px;margin:10px 0 4px}
input,textarea,select{width:100%;padding:9px;border:1px solid #ccc;border-radius:7px;font:inherit}
textarea{min-height:140px;resize:vertical}
button{border:0;border-radius:8px;padding:11px 14px;background:var(--green);color:#fff;font-weight:700;cursor:pointer;margin:8px 6px 0 0}
button.primary{background:var(--red);color:#fff}
button.danger{background:#a00;color:#fff;padding:6px 10px;font-size:12px;margin:0}
.small{font-size:12px;color:#555;margin-top:8px}
.preview{display:flex;align-items:flex-start;justify-content:center;min-width:0}
canvas{width:min(100%,600px);height:auto;box-shadow:0 4px 20px #0003;background:#fff;border-radius:4px}
.asset{display:grid;grid-template-columns:1fr 1fr;gap:8px}.asset input{font-size:12px;padding:7px}
.bank-row{display:flex;gap:6px;align-items:center;margin-top:4px}
.bank-row select{flex:1}
@media(max-width:760px){main{grid-template-columns:1fr;margin:0;padding:10px}.preview{order:-1}.panel{max-height:none}}
</style></head><body><main>
<section class="panel">
<h1>ERK bildgenerator</h1>
<label>Inläggstyp</label>
<select id="kind">
  <option value="preview">Matchvecka / Nästa match (Helbild)</option>
  <option value="lineup">Laguppställning</option>
  <option value="match">Matchdag</option>
  <option value="double">Dubbelmatch (Dam & Herr)</option>
  <option value="score">Slutresultat</option>
</select>

<label>Huvudrubrik (på bilden)</label>
<input id="mainTitle" value="NÄSTA MATCH">

<div id="standardMatchFields">
  <label>Hemmalag</label><input id="homeTeam" value="ENKÖPINGS RK">
  <label>Bortalag</label><input id="awayTeam" value="MOTSTÅNDARE">
  <label>Ort / Spelplats</label><input id="venue" value="ENKÖPING">
  <label>Datum och avspark</label><input id="date" value="LÖRDAG 14:00">
  <label>Lag / nivå</label><input id="sub" value="Herrlaget" placeholder="Ex. Herrlaget">
</div>

<div id="doubleMatchFields" style="display:none;">
  <label>Ort / Spelplats</label><input id="doubleVenue" value="KORSÄNGEN, ENKÖPING">
  <label>Datum</label><input id="doubleDate" value="LÖRDAG 14 OKTOBER">
  
  <h2>Match 1 (t.ex. Dam)</h2>
  <label>Tid & Lag</label><input id="m1Sub" value="13:00 • DAMLAGET">
  <label>Hemmalag vs Bortalag</label><input id="m1Teams" value="ERK vs HAMMARBY IF">
  <label>Extra info</label><input id="m1Info" value="Allsvenskan">

  <h2>Match 2 (t.ex. Herr)</h2>
  <label>Tid & Lag</label><input id="m2Sub" value="15:00 • HERRLAGET">
  <label>Hemmalag vs Bortalag</label><input id="m2Teams" value="ERK vs PINGVIN RFC">
  <label>Extra info</label><input id="m2Info" value="Allsvenskan">
  
  <h2>Gemensam Extra Info</h2>
  <label>Kiosk / Entré / Stream</label><input id="doubleInfo" value="Entré 80 kr • Kiosk & Grill öppna • Fri entré för ungdomar">
</div>

<div id="matchInfoField">
  <h2>Fritext (Matchdag & Matchvecka)</h2>
  <label>Extra info (t.ex. Entré, Stream, Kiosk)</label>
  <input id="extraInfo" value="Entré 80 kr • Kiosk öppen • Fri entré för ungdomar">
</div>

<h2>Bild- & Logobank</h2>

<label>1. Klubbens fasta logotyp (ERK - uppe i hörnet)</label>
<input id="erkLogo" type="file" accept="image/*">
<div class="bank-row"><select id="erkLogoBank"></select><button class="danger" onclick="deleteSelectedImage('erkLogoBank')">🗑</button></div>

<label>2. Hemmalagets logotyp</label>
<input id="homeLogo" type="file" accept="image/*">
<div class="bank-row"><select id="homeLogoBank"></select><button class="danger" onclick="deleteSelectedImage('homeLogoBank')">🗑</button></div>

<label>3. Bortalagets logotyp</label>
<input id="awayLogo" type="file" accept="image/*">
<div class="bank-row"><select id="awayLogoBank"></select><button class="danger" onclick="deleteSelectedImage('awayLogoBank')">🗑</button></div>

<label>4. Matchfoto / Bakgrundsbild</label>
<input id="photo" type="file" accept="image/*">
<div class="bank-row"><select id="photoBank"></select><button class="danger" onclick="deleteSelectedImage('photoBank')">🗑</button></div>

<div id="scoreFields"><h2>Resultat</h2><div class="asset"><div><label>Hemmalag mål/poäng</label><input id="homeScore" type="number" value="24"></div><div><label>Bortalag mål/poäng</label><input id="awayScore" type="number" value="17"></div></div></div>

<div id="lineupFields">
<h2>Startspelare – 15</h2><label>En spelare per rad: nummer, namn</label><textarea id="starters">1, Spelare 1
2, Spelare 2
3, Spelare 3
4, Spelare 4
5, Spelare 5
6, Spelare 6
7, Spelare 7
8, Spelare 8
9, Spelare 9
10, Spelare 10
11, Spelare 11
12, Spelare 12
13, Spelare 13
14, Spelare 14
15, Spelare 15</textarea>
<h2>Reserver – 8</h2><label>En spelare per rad: nummer, namn</label><textarea id="subs">16, Reserv 1
17, Reserv 2
18, Reserv 3
19, Reserv 4
20, Reserv 5
21, Reserv 6
22, Reserv 7
23, Reserv 8</textarea>
<h2>Ledare och stöd</h2><label>En roll per rad: roll, namn</label><textarea id="staff">Tränare, Namn
Assisterande tränare, Namn
Fysio, Namn
Lagledare, Namn</textarea>
</div>
<button class="primary" id="download">Ladda ner PNG</button><button id="refresh">Uppdatera</button>
<p class="small">Alla uppladdade bilder sparas i din webbläsare automatiskt.</p>
</section><div class="preview"><canvas id="art" width="1080" height="1350"></canvas></div></main>
<script>
const $=id=>document.getElementById(id),c=$('art'),ctx=c.getContext('2d');
let erkLogoImg=null, homeLogoImg=null, awayLogoImg=null, photoImg=null;

// Långsmal, djup rugbyplan med höga målstolpar
const pitchBgImg = new Image();
pitchBgImg.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a8ec9"/>
      <stop offset="50%" stop-color="#8bbae3"/>
      <stop offset="100%" stop-color="#d3e6f7"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#346e28"/>
      <stop offset="50%" stop-color="#24541a"/>
      <stop offset="100%" stop-color="#183b10"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="600" fill="url(#sky)"/>
  <ellipse cx="200" cy="180" rx="220" ry="50" fill="#ffffff" opacity="0.45"/>
  <ellipse cx="850" cy="220" rx="260" ry="60" fill="#ffffff" opacity="0.4"/>
  <path d="M0,540 Q150,500 300,530 T600,510 T900,535 T1080,515 L1080,600 L0,600 Z" fill="#1b4218"/>
  <rect y="580" width="1080" height="770" fill="url(#grass)"/>
  <path d="M350,600 L-100,1350 M730,600 L1180,1350" stroke="#ffffff" stroke-width="5" opacity="0.75"/>
  <line x1="330" y1="620" x2="750" y2="620" stroke="#ffffff" stroke-width="4" opacity="0.6"/>
  <line x1="300" y1="660" x2="780" y2="660" stroke="#ffffff" stroke-width="7" opacity="0.85"/>
  <line x1="220" y1="780" x2="860" y2="780" stroke="#ffffff" stroke-width="6" opacity="0.75"/>
  <line x1="120" y1="940" x2="960" y2="940" stroke="#ffffff" stroke-width="5" stroke-dasharray="15,10" opacity="0.7"/>
  <line x1="-10" y1="1160" x2="1090" y2="1160" stroke="#ffffff" stroke-width="6" opacity="0.75"/>
  <line x1="380" y1="660" x2="180" y2="1160" stroke="#ffffff" stroke-width="3" stroke-dasharray="8,12" opacity="0.45"/>
  <line x1="700" y1="660" x2="900" y2="1160" stroke="#ffffff" stroke-width="3" stroke-dasharray="8,12" opacity="0.45"/>
  <g stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.95">
    <line x1="435" y1="210" x2="435" y2="660"/>
    <line x1="645" y1="210" x2="645" y2="660"/>
    <line x1="435" y1="430" x2="645" y2="430" stroke-width="7"/>
  </g>
  <rect x="428" y="640" width="14" height="22" fill="#ffffff" opacity="0.9"/>
  <rect x="638" y="640" width="14" height="22" fill="#ffffff" opacity="0.9"/>
</svg>`);

pitchBgImg.onload = () => draw();

const COLOR_GREEN='#0e5228';
const COLOR_RED='#c8232c';
const COLOR_YELLOW='#f5c400';
const COLOR_WHITE='#ffffff';
const COLOR_DARK='#111111';
const COLOR_BG='#ffffff';

const COLOR_CARD='rgba(255, 255, 255, 0.88)';
const COLOR_CARD_ALT='rgba(240, 246, 241, 0.94)';

// IndexedDB för lokal bildbank
let db;
const request = indexedDB.open("ERKImageBankDB_v2", 1);
request.onupgradeneeded = e => {
  db = e.target.result;
  if (!db.objectStoreNames.contains("images")) {
    db.createObjectStore("images", { keyPath: "id", autoIncrement: true });
  }
};
request.onsuccess = e => {
  db = e.target.result;
  loadBankOptions();
};

function saveImageToBank(type, name, dataUrl) {
  if (!db) return;
  const tx = db.transaction("images", "readwrite");
  const store = tx.objectStore("images");
  store.add({ type, name, dataUrl, date: Date.now() });
  tx.oncomplete = () => loadBankOptions();
}

function loadBankOptions() {
  if (!db) return;
  const tx = db.transaction("images", "readonly");
  const store = tx.objectStore("images");
  const req = store.getAll();
  req.onsuccess = () => {
    const items = req.result;
    populateSelect('erkLogoBank', items.filter(x=>x.type==='erkLogo'||x.type==='logo'));
    populateSelect('homeLogoBank', items.filter(x=>x.type==='homeLogo'||x.type==='logo'||x.type==='oppLogo'));
    populateSelect('awayLogoBank', items.filter(x=>x.type==='awayLogo'||x.type==='logo'||x.type==='oppLogo'));
    populateSelect('photoBank', items.filter(x=>x.type==='photo'));
  };
}

function populateSelect(selectId, items) {
  const sel = $(selectId);
  const currentVal = sel.value;
  sel.innerHTML = '<option value="">-- Välj sparat foto/logga --</option>';
  items.forEach(item => {
    const opt = document.createElement('option');
    opt.value = item.dataUrl;
    opt.dataset.id = item.id;
    opt.textContent = item.name;
    sel.appendChild(opt);
  });
  sel.value = currentVal;
}

function deleteSelectedImage(selectId) {
  const sel = $(selectId);
  const selectedOpt = sel.options[sel.selectedIndex];
  if (!selectedOpt || !selectedOpt.dataset.id) {
    alert("Välj en bild i listan som du vill ta bort.");
    return;
  }
  const id = Number(selectedOpt.dataset.id);
  if (confirm(`Vill du ta bort "${selectedOpt.textContent}" från bildbanken?`)) {
    const tx = db.transaction("images", "readwrite");
    tx.objectStore("images").delete(id);
    tx.oncomplete = () => {
      if (selectId === 'erkLogoBank') erkLogoImg = null;
      if (selectId === 'homeLogoBank') homeLogoImg = null;
      if (selectId === 'awayLogoBank') awayLogoImg = null;
      if (selectId === 'photoBank') photoImg = null;
      loadBankOptions();
      draw();
    };
  }
}

function bindFileAndBank(fileId, bankId, type, setImg) {
  $(fileId).addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const dataUrl = ev.target.result;
      const im = new Image();
      im.onload = () => {
        setImg(im);
        draw();
        saveImageToBank(type, f.name, dataUrl);
      };
      im.src = dataUrl;
    };
    reader.readAsDataURL(f);
  });

  $(bankId).addEventListener('change', e => {
    const val = e.target.value;
    if (!val) { setImg(null); draw(); return; }
    const im = new Image();
    im.onload = () => {
      setImg(im);
      draw();
    };
    im.src = val;
  });
}

bindFileAndBank('erkLogo', 'erkLogoBank', 'erkLogo', x => erkLogoImg = x);
bindFileAndBank('homeLogo', 'homeLogoBank', 'homeLogo', x => homeLogoImg = x);
bindFileAndBank('awayLogo', 'awayLogoBank', 'awayLogo', x => awayLogoImg = x);
bindFileAndBank('photo', 'photoBank', 'photo', x => photoImg = x);

function val(id){ const el=$(id); return el ? el.value.trim() : ''; }
function lines(id,max){ return val(id).split('\n').map(s=>s.trim()).filter(Boolean).slice(0,max); }
function parse(s){ const a=s.split(/[,;–]/); return [(a.shift()||'').trim(),a.join(' ').trim()||s]; }

function fitText(t,x,y,max,size=26,color=COLOR_DARK,align='left',weight='bold'){
  if(!t) return;
  ctx.fillStyle=color;
  ctx.font=`${weight} ${size}px Arial`;
  ctx.textAlign=align;
  while(ctx.measureText(t).width>max&&size>12){
    size--;
    ctx.font=`${weight} ${size}px Arial`;
  }
  ctx.fillText(t,x,y);
}

function imageBox(img,x,y,w,h,contain=false){
  if(!img)return;
  ctx.save();
  ctx.beginPath();
  ctx.rect(x,y,w,h);
  ctx.clip();
  let s=contain?Math.min(w/img.width,h/img.height):Math.max(w/img.width,h/img.height);
  let dw=img.width*s,dh=img.height*s;
  ctx.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
  ctx.restore();
}

function base(titleText, fullImageBg=false){
  ctx.fillStyle=COLOR_BG;
  ctx.fillRect(0,0,1080,1350);
  
  if(fullImageBg && pitchBgImg.complete){
    ctx.save();
    ctx.drawImage(pitchBgImg, 0, 0, 1080, 1350);
    ctx.restore();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
    ctx.fillRect(0, 0, 1080, 1350);
  }
  
  // Toppbårder
  ctx.fillStyle=COLOR_GREEN; ctx.fillRect(0,0,1080,24);
  ctx.fillStyle=COLOR_RED; ctx.fillRect(0,24,1080,12);
  
  // Bottenbårder
  ctx.fillStyle=COLOR_YELLOW; ctx.fillRect(0,1270,1080,10);
  ctx.fillStyle=COLOR_GREEN; ctx.fillRect(0,1280,1080,70);
  
  // ERK-logga alltid uppe i vänstra hörnet
  if(erkLogoImg){
    imageBox(erkLogoImg,70,45,160,160,true);
  }
  
  fitText('ENKÖPINGS RUGBYKLUBB',250,120,750,38,COLOR_GREEN);
  
  ctx.fillStyle=COLOR_RED;
  ctx.fillRect(70,210,940,8);
  
  // Huvudrubrik
  fitText(titleText.toUpperCase(),70,285,940,64,COLOR_GREEN);
  
  if(val('kind') !== 'double'){
    fitText((val('sub')||'').toUpperCase(),70,332,920,28,COLOR_RED);
  }
}

function draw(){
  let k=val('kind'),
      customTitle = val('mainTitle') || 'MATCHDAG',
      homeT=(val('homeTeam')||'HEMMALAG').toUpperCase(),
      awayT=(val('awayTeam')||'BORTALAG').toUpperCase(),
      venue=(val('venue')||'').toUpperCase(),
      date=(val('date')||'').toUpperCase(),
      matchVsTitle = homeT + '  VS  ' + awayT;

  ctx.clearRect(0,0,1080,1350);
  
  if(k==='preview'){
    // --- HELBILDSVISNING / MATCHVECKA ---
    if(photoImg){
      imageBox(photoImg, 0, 0, 1080, 1350, false);
    } else if(pitchBgImg.complete) {
      ctx.drawImage(pitchBgImg, 0, 0, 1080, 1350);
    }

    // Gradienter för läsbarhet
    let gradBottom = ctx.createLinearGradient(0, 450, 0, 1350);
    gradBottom.addColorStop(0, 'rgba(0,0,0,0)');
    gradBottom.addColorStop(0.35, 'rgba(0,0,0,0.75)');
    gradBottom.addColorStop(1, 'rgba(0,0,0,0.96)');
    ctx.fillStyle = gradBottom;
    ctx.fillRect(0, 450, 1080, 900);

    let gradTop = ctx.createLinearGradient(0, 0, 0, 380);
    gradTop.addColorStop(0, 'rgba(0,0,0,0.85)');
    gradTop.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gradTop;
    ctx.fillRect(0, 0, 1080, 380);

    // Topp-bårder
    ctx.fillStyle=COLOR_GREEN; ctx.fillRect(0,0,1080,18);
    ctx.fillStyle=COLOR_RED; ctx.fillRect(0,18,1080,10);

    // ERK Logga i hörnet
    if(erkLogoImg) imageBox(erkLogoImg, 70, 45, 140, 140, true);
    fitText('ENKÖPINGS RUGBYKLUBB', 230, 110, 780, 36, COLOR_WHITE);
    fitText((val('sub')||'HERRLAGET').toUpperCase(), 230, 150, 780, 24, COLOR_YELLOW);

    // Rubrik
    fitText(customTitle.toUpperCase(), 70, 270, 940, 68, COLOR_WHITE);
    ctx.fillStyle=COLOR_RED; ctx.fillRect(70, 290, 220, 6);

    // Nedre del – Tydligt separerade loggor och text
    let textCenter = 900;
    let logoCenterY = 730;

    // Hemmalag och Bortalag loggor sida vid sida
    if(homeLogoImg) imageBox(homeLogoImg, 280, logoCenterY, 180, 130, true);
    if(awayLogoImg) imageBox(awayLogoImg, 620, logoCenterY, 180, 130, true);

    // VS i mitten mellan loggor
    fitText('VS', 540, logoCenterY + 80, 100, 36, COLOR_YELLOW, 'center');

    // Lagnamn
    fitText(matchVsTitle, 540, textCenter, 980, 48, COLOR_WHITE, 'center');
    
    // Röd avdelare
    ctx.fillStyle=COLOR_RED; ctx.fillRect(440, textCenter + 20, 200, 5);

    // Tid & Plats
    fitText(venue + '   •   ' + date, 540, textCenter + 75, 980, 32, COLOR_YELLOW, 'center');

    // Extra info-ruta
    let infoText = val('extraInfo');
    if(infoText){
      ctx.fillStyle = 'rgba(14, 82, 40, 0.88)';
      ctx.fillRect(140, textCenter + 110, 800, 60);
      ctx.strokeStyle = COLOR_YELLOW;
      ctx.lineWidth = 2;
      ctx.strokeRect(140, textCenter + 110, 800, 60);
      
      fitText(infoText, 540, textCenter + 148, 760, 23, COLOR_WHITE, 'center');
    }

    if(!photoImg){
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(70, 320, 940, 340);
      fitText('LÄGG TILL MATCHFOTO (VALFRITT)', 540, 490, 800, 28, COLOR_WHITE, 'center');
    }

  }else if(k==='lineup'){
    base(customTitle, true);
    
    fitText(matchVsTitle,72,390,650,36,COLOR_DARK);
    fitText(venue+'  •  '+date,72,430,650,24,COLOR_RED);
    
    // Loggor uppe till höger
    if(homeLogoImg) imageBox(homeLogoImg, 760, 330, 110, 110, true);
    if(awayLogoImg) imageBox(awayLogoImg, 890, 330, 110, 110, true);
    
    let st=lines('starters',15),su=lines('subs',8),top=455;
    
    // START XV
    ctx.fillStyle=COLOR_GREEN; ctx.fillRect(70,top,460,45);
    fitText('START XV',88,top+32,400,25,COLOR_YELLOW);
    
    let rh=39;
    st.forEach((s,i)=>{
      let y=top+50+i*rh;
      ctx.fillStyle=i%2?COLOR_CARD:COLOR_CARD_ALT;
      ctx.fillRect(70,y,460,35);
      let [n,name]=parse(s);
      fitText(n,86,y+26,45,23,COLOR_RED);
      fitText(name,145,y+26,370,24,COLOR_DARK);
    });
    
    let sx=550;
    // RESERVER
    ctx.fillStyle=COLOR_GREEN; ctx.fillRect(sx,top,460,45);
    fitText('RESERVER',sx+18,top+32,400,25,COLOR_YELLOW);
    
    su.forEach((s,i)=>{
      let y=top+50+i*rh;
      ctx.fillStyle=i%2?COLOR_CARD:COLOR_CARD_ALT;
      ctx.fillRect(sx,y,460,35);
      let [n,name]=parse(s);
      fitText(n,sx+16,y+26,45,23,COLOR_RED);
      fitText(name,sx+75,y+26,360,24,COLOR_DARK);
    });
    
    // LEDARSTAB
    let staff=lines('staff',8),sy=top+50+15*rh+12;
    ctx.fillStyle=COLOR_GREEN; ctx.fillRect(70,sy,940,40);
    fitText('LEDARSTAB',88,sy+28,300,23,COLOR_YELLOW);
    
    staff.forEach((s,i)=>{
      let [role,name]=parse(s),x=70+(i%2)*475,y=sy+46+Math.floor(i/2)*34;
      ctx.fillStyle=COLOR_CARD;
      ctx.fillRect(x,y,465,30);
      fitText(role.toUpperCase(),x+12,y+21,180,18,COLOR_RED);
      fitText(name,x+195,y+21,260,21,COLOR_DARK);
    });

  }else if(k==='double'){
    base(customTitle, false);
    
    let dVenue = (val('doubleVenue')||'').toUpperCase();
    let dDate = (val('doubleDate')||'').toUpperCase();
    fitText(dVenue + '  •  ' + dDate, 72, 350, 920, 26, COLOR_RED);
    
    imageBox(photoImg,70,380,940,450,false);
    if(!photoImg){
      ctx.fillStyle='#f2f5f3'; ctx.fillRect(70,380,940,450);
      ctx.strokeStyle='#b0c2b3'; ctx.lineWidth=4; ctx.strokeRect(86,396,908,418);
      fitText('LÄGG TILL MATCHFOTO',540,610,800,34,'#5c7360','center');
    }
    
    // KORT MATCH 1
    ctx.fillStyle=COLOR_GREEN; ctx.fillRect(70,850,455,270);
    ctx.fillStyle=COLOR_RED; ctx.fillRect(70,850,455,8);
    fitText((val('m1Sub')||'MATCH 1').toUpperCase(), 297, 895, 430, 26, COLOR_YELLOW, 'center');
    fitText((val('m1Teams')||'').toUpperCase(), 297, 950, 430, 30, COLOR_WHITE, 'center');
    fitText(val('m1Info'), 297, 1030, 420, 24, COLOR_YELLOW, 'center', 'normal');
    
    // KORT MATCH 2
    ctx.fillStyle=COLOR_GREEN; ctx.fillRect(555,850,455,270);
    ctx.fillStyle=COLOR_RED; ctx.fillRect(555,850,455,8);
    fitText((val('m2Sub')||'MATCH 2').toUpperCase(), 782, 895, 430, 26, COLOR_YELLOW, 'center');
    fitText((val('m2Teams')||'').toUpperCase(), 782, 950, 430, 30, COLOR_WHITE, 'center');
    fitText(val('m2Info'), 782, 1030, 420, 24, COLOR_YELLOW, 'center', 'normal');
    
    // GEMENSAM EXTRA INFO
    let doubleInfoText = val('doubleInfo');
    if(doubleInfoText){
      ctx.fillStyle=COLOR_YELLOW; ctx.fillRect(70,1140,940,60);
      fitText(doubleInfoText, 540, 1178, 900, 24, COLOR_DARK, 'center');
    }

  }else{
    // MATCHDAG / SLUTRESULTAT
    base(customTitle, false);
    fitText(matchVsTitle,72,385,920,44,COLOR_DARK);
    fitText(venue+'  •  '+date,72,430,920,26,COLOR_RED);
    
    imageBox(photoImg,70,450,940,610,false);
    if(!photoImg){
      ctx.fillStyle='#f2f5f3'; ctx.fillRect(70,450,940,610);
      ctx.strokeStyle='#b0c2b3'; ctx.lineWidth=4; ctx.strokeRect(86,466,908,578);
      fitText('LÄGG TILL MATCHFOTO',540,755,800,36,'#5c7360','center');
    }
    
    if(k==='score'){
      ctx.fillStyle=COLOR_GREEN; ctx.fillRect(70,1080,940,180);
      ctx.fillStyle=COLOR_YELLOW; ctx.fillRect(70,1080,940,8);
      
      // Hemmalag
      if(homeLogoImg) imageBox(homeLogoImg,90,1110,110,110,true);
      fitText(homeT,220,1145,230,34,COLOR_YELLOW);
      fitText(val('homeScore')||'0',280,1235,200,85,COLOR_WHITE,'center');
      
      ctx.fillStyle=COLOR_RED; ctx.fillRect(533,1105,14,135);
      
      // Bortalag
      if(awayLogoImg){
        imageBox(awayLogoImg,880,1110,110,110,true);
        fitText(awayT,860,1145,230,34,COLOR_WHITE,'right');
      } else {
        fitText(awayT,790,1145,250,34,COLOR_WHITE,'center');
      }
      fitText(val('awayScore')||'0',790,1235,200,85,COLOR_WHITE,'center');
      
    }else{
      // MATCHDAG STANDARD
      ctx.fillStyle=COLOR_GREEN; ctx.fillRect(70,1080,940,180);
      ctx.fillStyle=COLOR_RED; ctx.fillRect(70,1080,940,8);
      
      if(homeLogoImg) imageBox(homeLogoImg,90,1115,110,110,true);
      if(awayLogoImg) imageBox(awayLogoImg,880,1115,110,110,true);
      
      fitText(matchVsTitle,540,1132,620,34,COLOR_WHITE,'center');
      
      let infoText = val('extraInfo');
      if(infoText){
        ctx.fillStyle=COLOR_YELLOW; ctx.fillRect(290,1165,500,55);
        fitText(infoText,540,1202,480,22,COLOR_DARK,'center');
      }
    }
  }
  
  // Footer
  fitText('erk.nu   •   @enköpingsrugbyklubb   •   erk.kansli@gmail.com',540,1325,1000,22,COLOR_WHITE,'center','normal');
}

$('kind').addEventListener('change',()=>{
  let k=val('kind');
  $('lineupFields').style.display=k==='lineup'?'block':'none';
  $('scoreFields').style.display=k==='score'?'block':'none';$('matchInfoField').style.display=(k==='match'||k==='preview')?'block':'none';
  $('standardMatchFields').style.display=k==='double'?'none':'block';$('doubleMatchFields').style.display=k==='double'?'block':'none';
  
  if(k==='preview') $('mainTitle').value = 'NÄSTA MATCH';
  else if(k==='lineup') $('mainTitle').value = 'LAGUPPSTÄLLNING';
  else if(k==='match') $('mainTitle').value = 'MATCHDAG';
  else if(k==='double') $('mainTitle').value = 'MATCHDAG – DUBBELARRANGEMANG';
  else if(k==='score') $('mainTitle').value = 'SLUTRESULTAT';
  
  draw();
});

['mainTitle','homeTeam','awayTeam','venue','date','sub','homeScore','awayScore','starters','subs','staff','extraInfo','doubleVenue','doubleDate','m1Sub','m1Teams','m1Info','m2Sub','m2Teams','m2Info','doubleInfo'].forEach(id=>{
  const el=$(id);
  if(el) el.addEventListener('input',draw);
});

$('refresh').onclick=draw;
$('download').onclick=()=>{
  draw();
  let a=document.createElement('a');
  a.download='erk-'+val('kind')+'.png';
  a.href=c.toDataURL('image/png');
  a.click();
};

$('kind').dispatchEvent(new Event('change'));
